name: jobradar
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: postgres
    command: postgres -c shared_buffers=128MB -c max_connections=50
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [messaging]
    command: >
      redpanda start --mode dev-container --smp 1 --memory 512M --overprovisioned
      --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]
  mailhog:
    image: mailhog/mailhog
    profiles: [messaging]
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
