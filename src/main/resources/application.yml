spring:
  application.name: jobradar-core-api
  config.import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobradar_core}
    username: ${DB_USER:jobradar}
    password: ${DB_PASSWORD:jobradar}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  mvc.problemdetails.enabled: true
  servlet.multipart:
    max-file-size: 2MB
    max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: jobradar-core-api
      auto-offset-reset: earliest
server.port: 8080
management.health.mail.enabled: false
app:
  mail-from: ${MAIL_FROM:jobradar@localhost}
  kafka.enabled: ${KAFKA_ENABLED:true}
  reminders:
    cron: ${REMINDER_CRON:0 0 9 * * *}
    zone: ${REMINDER_ZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  cors.allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
